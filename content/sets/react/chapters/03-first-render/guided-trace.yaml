  - id: step-4
    title: Every update first gets a lane
    symbol: updateContainer
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberReconciler.js
    lines: 353-370
    body: >-
      container.current is the HostRoot fiber from step 2. Before anything is queued, React decides how
      urgent this update is by asking for a lane — a single bit in a 31-bit mask. Lanes are how every later
      step compares, batches and orders work.
    code: |
      export function updateContainer(
        element: ReactNodeList,
        container: OpaqueRoot,
        parentComponent: ?component(...props: any),
        callback: ?Function,
      ): Lane {
        const current = container.current;
        const lane = requestUpdateLane(current);
        updateContainerImpl(
          current,
          lane,
          element,
          container,
          parentComponent,
          callback,
        );
        return lane;
      }
    next: requestUpdateLane(current)
  - id: step-5
    title: No render in progress, no transition
    symbol: requestUpdateLane
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberWorkLoop.js
    lines: 812-868
    body: >-
      The special cases come first: legacy roots are always SyncLane, and an update fired while this root
      is rendering borrows the lanes being rendered. An update inside startTransition gets a transition
      lane. Ours is neither, so the lane comes from the current event priority, which the DOM renderer
      supplies.
    code: |
      export function requestUpdateLane(fiber: Fiber): Lane {
        // Special cases
        const mode = fiber.mode;
        if (!disableLegacyMode && (mode & ConcurrentMode) === NoMode) {
          return SyncLane as Lane;
        } else if (
          (executionContext & RenderContext) !== NoContext &&
          workInProgressRootRenderLanes !== NoLanes
        ) {
          // ... render-phase updates reuse the lanes being rendered
          return pickArbitraryLane(workInProgressRootRenderLanes);
        }

        const transition = requestCurrentTransition();
        if (transition !== null) {
          // ... gesture check and DEV bookkeeping
          return requestTransitionLane(transition);
        }

        const priority = resolveUpdatePriority();
        // ... DEV only
        return eventPriorityToLane(priority);
      }
    next: resolveUpdatePriority() → react-dom-bindings
  - id: step-6
    title: The DOM reads window.event
    symbol: resolveUpdatePriority
    package: react-dom-bindings
    file: packages/react-dom-bindings/src/client/ReactDOMUpdatePriority.js
    lines: 35-45
    body: >-
      An explicit priority set by React itself wins. Otherwise the renderer looks at the browser event
      being dispatched right now: a click is discrete, a scroll is continuous. Our render call runs at
      module load, outside any event, so window.event is undefined and the answer is DefaultEventPriority.
      Event priorities are defined as lanes, so eventPriorityToLane just returns it: DefaultLane.
    code: |
      export function resolveUpdatePriority(): EventPriority {
        const updatePriority = ReactDOMSharedInternals.p; /* currentUpdatePriority */
        if (updatePriority !== NoEventPriority) {
          return updatePriority;
        }
        const currentEvent = window.event;
        if (currentEvent === undefined) {
          return DefaultEventPriority;
        }
        return getEventPriority(currentEvent.type);
      }
    next: updateContainerImpl(current, DefaultLane, <App />, …)
  - id: step-7
    title: The element becomes the payload of an update
    symbol: updateContainerImpl
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberReconciler.js
    lines: 393-458
    body: >-
      Nothing is rendered here. An update object is created for the lane and its payload is {element} —
      the same element field the HostRoot's state was initialised with in step 2. enqueueUpdate stashes it
      in a concurrent queue (it moves onto the HostRoot's queue when the next render starts), sets the lane
      on the fiber, and returns the FiberRoot, which is then marked as needing work.
    code: |
      function updateContainerImpl(
        rootFiber: Fiber,
        lane: Lane,
        element: ReactNodeList,
        container: OpaqueRoot,
        parentComponent: ?component(...props: any),
        callback: ?Function,
      ): void {
        // ... DEV hooks, scheduling profiler, legacy context
        const update = createUpdate(lane);
        // Caution: React DevTools currently depends on this property
        // being called "element".
        update.payload = {element};
        // ... optional callback (legacy roots only)
        const root = enqueueUpdate(rootFiber, update, lane);
        if (root !== null) {
          startUpdateTimerByLane(lane, 'root.render()', null);
          scheduleUpdateOnFiber(root, rootFiber, lane);
          entangleTransitions(root, rootFiber, lane);
        }
      }
    next: scheduleUpdateOnFiber(root, rootFiber, lane)
  - id: step-8
    title: The root records the pending lane
