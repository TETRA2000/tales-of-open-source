    body: >-
      This is where every kind of update meets: root.render, setState, a class component's setState.
      markRootUpdated ORs the lane into root.pendingLanes. Most of the rest handles an update that arrives
      while a render is already in progress. Ours is not, so the interesting line is ensureRootIsScheduled.
    code: |
      export function scheduleUpdateOnFiber(
        root: FiberRoot,
        fiber: Fiber,
        lane: Lane,
      ) {
        // ... DEV warnings; restart if the current render is suspended on data
        // Mark that the root has a pending update.
        markRootUpdated(root, lane);

        if (
          (executionContext & RenderContext) !== NoContext &&
          root === workInProgressRoot
        ) {
          // ... an update during the render phase
        } else {
          // ... DevTools and transition tracing bookkeeping
          if (root === workInProgressRoot) {
            // ... interleaved update into an in-progress render
          }

          ensureRootIsScheduled(root);
          // ... legacy-mode synchronous flush
        }
      }
    next: ensureRootIsScheduled(root)
  - id: step-9
    title: Roots wait in a list for a microtask
    symbol: ensureRootIsScheduled
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberRootScheduler.js
    lines: 116-169
    body: >-
      Scheduling is deferred on purpose. The root is appended to a linked list of scheduled roots, and at
      most one microtask is requested no matter how many updates arrive in the same tick. That is what
      batches several setState calls in one event handler into one render.
    code: |
      export function ensureRootIsScheduled(root: FiberRoot): void {
        // ... comment: this only adds the root to the schedule and requests a microtask
        // Add the root to the schedule
        if (root === lastScheduledRoot || root.next !== null) {
          // Fast path. This root is already scheduled.
        } else {
          if (lastScheduledRoot === null) {
            firstScheduledRoot = lastScheduledRoot = root;
          } else {
            lastScheduledRoot.next = root;
            lastScheduledRoot = root;
          }
        }
        // ... mightHavePendingSyncWork = true
        ensureScheduleIsScheduled();
        // ... act() bookkeeping for legacy roots
      }

      export function ensureScheduleIsScheduled(): void {
        // ... act() queue in tests
          if (!didScheduleMicrotask) {
            didScheduleMicrotask = true;
            scheduleImmediateRootScheduleTask();
          }
        }
      }
    next: scheduleImmediateRootScheduleTask()
  - id: step-10
    title: queueMicrotask, not the Scheduler
