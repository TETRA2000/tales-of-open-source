    body: >-
      In the browser supportsMicrotasks is true and scheduleMicrotask is queueMicrotask (with a Promise
      fallback). The callback runs right after the current script finishes. The Safari guard only matters
      if a microtask fires in the middle of React's own render or commit.
    code: |
      function scheduleImmediateRootScheduleTask() {
        // ... act() queue in tests
        // TODO: Can we land supportsMicrotasks? Which environments don't support it?
        // Alternatively, can we move this check to the host config?
        // $FlowFixMe[constant-condition]
        if (supportsMicrotasks) {
          scheduleMicrotask(() => {
            // ... Safari: if already rendering or committing, use a Scheduler task instead
            processRootScheduleInMicrotask();
          });
        } else {
          // If microtasks are not supported, use Scheduler.
          Scheduler_scheduleCallback(
            ImmediateSchedulerPriority,
            processRootScheduleInImmediateTask,
          );
        }
      }
    next: processRootScheduleInMicrotask → scheduleTaskForRootDuringMicrotask(root, now)
  - id: step-11
    title: DefaultLane becomes a NormalPriority Scheduler task
    symbol: scheduleTaskForRootDuringMicrotask
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberRootScheduler.js
    lines: 384-509
    body: >-
      The microtask walks the root list and calls this for each root. getNextLanes picks DefaultLane from
      pendingLanes. It is not SyncLane — sync work would be flushed at the end of the same microtask — so
      React asks the Scheduler package for a task at NormalPriority and stores it as root.callbackNode.
      The render itself will start when the Scheduler calls performWorkOnRootViaSchedulerTask.
    code: |
      function scheduleTaskForRootDuringMicrotask(
        root: FiberRoot,
        currentTime: number,
      ): Lane {
        // ... comments: never performs React work synchronously
        markStarvedLanesAsExpired(root, currentTime);
        // ... pending passive effects, work-in-progress root
        const nextLanes =
          enableYieldingBeforePassive && root === rootWithPendingPassiveEffects
            ? // This will schedule the callback at the priority of the lane but we used to
              // always schedule it at NormalPriority. Discrete will flush it sync anyway.
              // So the only difference is Idle and it doesn't seem necessarily right for that
              // to get upgraded beyond something important just because we're past commit.
              pendingPassiveEffectsLanes
            : getNextLanes(
                root,
                root === workInProgressRoot ? workInProgressRootRenderLanes : NoLanes,
                rootHasPendingCommit,
              );
        // ... nothing to do, or suspended: cancel any task and return NoLane
        // Schedule a new callback in the host environment.
        if (
          includesSyncLane(nextLanes) &&
          // If we're prerendering, then we should use the concurrent work loop
          // even if the lanes are synchronous, so that prerendering never blocks
          // the main thread.
          !checkIfRootIsPrerendering(root, nextLanes)
        ) {
          // ... sync work is flushed at the end of the microtask
          return SyncLane;
        } else {
          // ... reuse the existing task if its priority has not changed
          let schedulerPriorityLevel;
          switch (lanesToEventPriority(nextLanes)) {
            // ... Discrete and Continuous → UserBlockingSchedulerPriority
            case DefaultEventPriority:
              schedulerPriorityLevel = NormalSchedulerPriority;
              break;
            // ... Idle → IdleSchedulerPriority; anything else → NormalSchedulerPriority
          }

          const newCallbackNode = scheduleCallback(
            schedulerPriorityLevel,
            performWorkOnRootViaSchedulerTask.bind(null, root),
          );

          root.callbackPriority = newCallbackPriority;
          root.callbackNode = newCallbackNode;
          return newCallbackPriority;
        }
      }
    next: Scheduler → performWorkOnRootViaSchedulerTask(root)
