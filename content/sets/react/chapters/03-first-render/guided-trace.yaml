steps:
  - id: step-1
    title: createRoot checks the container and builds a FiberRoot
    symbol: createRoot
    package: react-dom
    file: packages/react-dom/src/client/ReactDOMRoot.js
    lines: 171-262
    body: >-
      The public entry point in react-dom/client. After validating the DOM node and reading options, it
      asks the reconciler for a container — a FiberRoot, tagged ConcurrentRoot. Two things happen to the
      DOM node before anything is rendered: it is marked as a React root, and React attaches its own
      listeners for every event it supports — capture phase and, for most events, bubble phase — to it.
      What you get back is a thin ReactDOMRoot that only holds _internalRoot.
    code: |
      export function createRoot(
        container: Element | Document | DocumentFragment,
        options?: CreateRootOptions,
      ): RootType {
        if (!isValidContainer(container)) {
          throw new Error('Target container is not a DOM element.');
        }
        // ... read options: strict mode, identifierPrefix, error handlers, transition callbacks
        const root = createContainer(
          container,
          ConcurrentRoot,
          null,
          isStrictMode,
          concurrentUpdatesByDefaultOverride,
          identifierPrefix,
          onUncaughtError,
          onCaughtError,
          onRecoverableError,
          onDefaultTransitionIndicator,
          transitionCallbacks,
        );
        markContainerAsRoot(root.current, container);

        const rootContainerElement: Document | Element | DocumentFragment =
          !disableCommentsAsDOMContainers && container.nodeType === COMMENT_NODE
            ? (container.parentNode as any)
            : container;
        listenToAllSupportedEvents(rootContainerElement);

        // $FlowFixMe[invalid-constructor] Flow no longer supports calling new on functions
        return new ReactDOMRoot(root);
      }
    next: createContainer → createFiberRoot(containerInfo, tag, …)
  - id: step-2
    title: Two objects that point at each other
    symbol: createFiberRoot
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberRoot.js
    lines: 157-236
    body: >-
      createContainer passes straight through to here. The FiberRoot is not a fiber: it is the bookkeeping
      object for the whole tree (pending lanes, the scheduled task, the DOM container). Its current field
      points at a HostRoot fiber, and that fiber's stateNode points back. The HostRoot fiber starts with
      element null and an empty update queue; rendering <App /> will be an update on that queue.
    code: |
      export function createFiberRoot(
        containerInfo: Container,
        // ... tag, hydrate, strict mode, error handlers and other options
      ): FiberRoot {
        // $FlowFixMe[invalid-constructor] Flow no longer supports calling new on functions
        const root: FiberRoot = new FiberRootNode(
          containerInfo,
          tag,
          hydrate,
          identifierPrefix,
          onUncaughtError,
          onCaughtError,
          onRecoverableError,
          onDefaultTransitionIndicator,
          formState,
        ) as any;
        // ... suspense and transition-tracing callbacks
        // Cyclic construction. This cheats the type system right now because
        // stateNode is any.
        const uninitializedFiber = createHostRootFiber(tag, isStrictMode);
        root.current = uninitializedFiber;
        uninitializedFiber.stateNode = root;

        const initialCache = createCache();
        retainCache(initialCache);
        // ... the pooled cache
        const initialState: RootState = {
          element: initialChildren,
          isDehydrated: hydrate,
          cache: initialCache,
        };
        uninitializedFiber.memoizedState = initialState;

        initializeUpdateQueue(uninitializedFiber);

        return root;
      }
    next: "root.render(<App />)"
