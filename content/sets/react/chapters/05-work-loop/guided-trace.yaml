    code: |
      function updateFunctionComponent(
        current: null | Fiber,
        workInProgress: Fiber,
        Component: any,
        nextProps: any,
        renderLanes: Lanes,
      ) {
        // ... DEV warnings; legacy context
        let nextChildren;
        let hasId;
        prepareToReadContext(workInProgress, renderLanes);
        // ... scheduling profiler
        if (__DEV__) {
          // ... the same call
        } else {
          nextChildren = renderWithHooks(
            current,
            workInProgress,
            Component,
            nextProps,
            context,
            renderLanes,
          );
          hasId = checkDidRenderIdHook();
        }
        // ...
