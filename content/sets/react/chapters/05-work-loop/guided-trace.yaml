    next: h1's fiber → updateHostComponent → null (text is not a fiber) → completeUnitOfWork
  - id: step-11
    title: Complete, then sibling, else climb
    symbol: completeUnitOfWork
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberWorkLoop.js
    lines: 3368-3431
    body: >-
      The h1's only child is the string "Hello", which updateHostComponent leaves to the DOM as text
      content, so beginWork returned null and the h1 completes. Completion then moves sideways to a sibling
      if there is one — its beginWork runs next — or back up through return, completing each parent in turn.
      Reaching past the root means the whole tree is done.
    code: |
      function completeUnitOfWork(unitOfWork: Fiber): void {
        // Attempt to complete the current unit of work, then move to the next
        // sibling. If there are no more siblings, return to the parent fiber.
        let completedWork: Fiber = unitOfWork;
        do {
          // ... an Incomplete fiber (something threw below it) unwinds instead
          const current = completedWork.alternate;
          const returnFiber = completedWork.return;

          let next;
          startProfilerTimer(completedWork);
          if (__DEV__) {
            // ... runWithFiberInDEV(completedWork, completeWork, …)
          } else {
            next = completeWork(current, completedWork, entangledRenderLanes);
          }
          // ... profiler duration
          if (next !== null) {
            // Completing this fiber spawned new work. Work on that next.
            workInProgress = next;
            return;
          }

          const siblingFiber = completedWork.sibling;
          if (siblingFiber !== null) {
            // If there is more work to do in this returnFiber, do that next.
            workInProgress = siblingFiber;
            return;
          }
          // Otherwise, return to the parent
          // $FlowFixMe[incompatible-type] we bail out when we get a null
          completedWork = returnFiber;
          // Update the next thing we're working on in case something throws.
          workInProgress = completedWork;
        } while (completedWork !== null);

        // We've reached the root.
        if (workInProgressRootExitStatus === RootInProgress) {
          workInProgressRootExitStatus = RootCompleted;
        }
      }
    next: completeWork(current, h1Fiber, lanes)
  - id: step-12
    title: The DOM node is built off-screen
    symbol: completeWork (HostComponent)
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberCompleteWork.js
    lines: 1374-1453
    body: >-
      On mount, completeWork creates the real element — createInstance calls
      ownerDocument.createElement("h1") — and appendAllChildren attaches the DOM nodes of child fibers, which are already complete because
      completion runs bottom-up. finalizeInitialChildren sets the props, including "Hello" as textContent.
      None of this is in the document yet: the finished tree waits for the commit phase to insert it.
    code: |
      case HostComponent: {
        popHostContext(workInProgress);
        const type = workInProgress.type;
        if (current !== null && workInProgress.stateNode != null) {
          updateHostComponent(
            current,
            workInProgress,
            type,
            newProps,
            renderLanes,
          );
        } else {
          // ... no props after an aborted render
          const currentHostContext = getHostContext();
          // ... TODO comment
          const wasHydrated = popHydrationState(workInProgress);
          if (wasHydrated) {
            // ... adopt the server-rendered node
          } else {
            const rootContainerInstance = getRootHostContainer();
            const instance = createInstance(
              type,
              newProps,
              rootContainerInstance,
              currentHostContext,
              workInProgress,
            );
            // TODO: For persistent renderers, we should pass children as part
            // of the initial instance creation
            markCloned(workInProgress);
            appendAllChildren(instance, workInProgress, false, false);
            workInProgress.stateNode = instance;

            // Certain renderers require commit-time effects for initial mount.
            // (eg DOM renderer supports auto-focus for certain elements).
            // Make sure such renderers get scheduled for later work.
            if (
              finalizeInitialChildren(
                instance,
                type,
                newProps,
                currentHostContext,
              )
            ) {
              markUpdate(workInProgress);
            }
          }
        }
    next: finishConcurrentRender → completeRoot → commitRoot
