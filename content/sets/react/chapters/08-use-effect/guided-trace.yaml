example:
  label: The effect we follow
  request: "useEffect(() => { document.title = 'Ready'; }, []) inside App, first mounted by root.render(<App />)"
  target: "the effect runs in a Scheduler task after the commit"
steps:
  - id: step-1
    title: useEffect forwards to the dispatcher
    symbol: useEffect
    package: react
    file: packages/react/src/ReactHooks.js
    lines: 87-101
    body: >-
      Like every hook in the react package, it only checks its arguments in DEV and hands them to whatever
      dispatcher renderWithHooks installed. App is mounting, so that is HooksDispatcherOnMount and the call
      lands in mountEffect.
    code: |
      export function useEffect(
        create: () => (() => void) | void,
        deps: Array<mixed> | void | null,
      ): void {
        if (__DEV__) {
          if (create == null) {
            console.warn(
              'React Hook useEffect requires an effect callback. Did you forget to pass a callback to the hook?',
            );
          }
        }

        const dispatcher = resolveDispatcher();
        return dispatcher.useEffect(create, deps);
      }
    next: mountEffect(create, [])
  - id: step-2
    title: Two sets of flags, fiber and hook
    symbol: mountEffect
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberHooks.js
    lines: 2697-2719
    body: >-
      The fiber gets PassiveEffect — “this fiber has a useEffect to run after this commit” — plus
      PassiveStaticEffect, which is kept across renders so that on unmount React knows there may be a
      cleanup to run in this subtree. The hook itself is tagged
      HookPassive, which separates useEffect from useLayoutEffect and useInsertionEffect in the same list.
    code: |
      function mountEffect(
        create: () => (() => void) | void,
        deps: Array<mixed> | void | null,
      ): void {
        if (
          __DEV__ &&
          (currentlyRenderingFiber.mode & StrictEffectsMode) !== NoMode
        ) {
          mountEffectImpl(
            MountPassiveDevEffect | PassiveEffect | PassiveStaticEffect,
            HookPassive,
            create,
            deps,
          );
        } else {
          mountEffectImpl(
            PassiveEffect | PassiveStaticEffect,
            HookPassive,
            create,
            deps,
          );
        }
      }
    next: mountEffectImpl(fiberFlags, HookPassive, create, [])
  - id: step-3
    title: On mount, every effect has work to do
    symbol: mountEffectImpl
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberHooks.js
    lines: 2640-2655
    body: >-
      The effect takes a slot in the hook list like any other hook. HookHasEffect marks it as needing to
      run this commit; on mount that is always true. On later renders updateEffectImpl compares deps with
      Object.is and leaves HookHasEffect off when nothing changed — the effect stays in the list, it just
      does not fire. Our [] never changes, so it will run once.
    code: |
      function mountEffectImpl(
        fiberFlags: Flags,
        hookFlags: HookFlags,
        create: () => (() => void) | void,
        deps: Array<mixed> | void | null,
      ): void {
        const hook = mountWorkInProgressHook();
        const nextDeps = deps === undefined ? null : deps;
        currentlyRenderingFiber.flags |= fiberFlags;
        hook.memoizedState = pushSimpleEffect(
          HookHasEffect | hookFlags,
          createEffectInstance(),
          create,
          nextDeps,
        );
      }
    next: pushSimpleEffect(HookHasEffect | HookPassive, inst, create, [])
  - id: step-4
    title: Effects get their own circular list
    symbol: pushEffectImpl
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberHooks.js
    lines: 2588-2622
    body: >-
      The same effect object is stored twice: in the hook (so the next render can compare deps) and in a
      circular list on fiber.updateQueue, where lastEffect.next is the first effect. The commit phase walks
      only that list and never looks at hooks. inst is shared between renders and will hold the cleanup
      function.
    code: |
      function pushSimpleEffect(
        tag: HookFlags,
        inst: EffectInstance,
        create: () => (() => void) | void,
        deps: Array<mixed> | void | null,
      ): Effect {
        const effect: Effect = {
          tag,
          create,
          deps,
          inst,
          // Circular
          next: null as any,
        };
        return pushEffectImpl(effect);
      }

      function pushEffectImpl(effect: Effect): Effect {
        let componentUpdateQueue: null | FunctionComponentUpdateQueue =
          currentlyRenderingFiber.updateQueue as any;
        if (componentUpdateQueue === null) {
          componentUpdateQueue = createFunctionComponentUpdateQueue();
          currentlyRenderingFiber.updateQueue = componentUpdateQueue as any;
        }
        const lastEffect = componentUpdateQueue.lastEffect;
        if (lastEffect === null) {
          componentUpdateQueue.lastEffect = effect.next = effect;
        } else {
          const firstEffect = lastEffect.next;
          lastEffect.next = effect;
          effect.next = firstEffect;
          componentUpdateQueue.lastEffect = effect;
        }
        return effect;
      }
    next: App returns; completeWork → bubbleProperties
  - id: step-5
    title: The flag bubbles up to the root
    symbol: bubbleProperties
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberCompleteWork.js
    lines: 793-914
    body: >-
      Every completed fiber ORs its children's flags and subtreeFlags into its own subtreeFlags. By the time
      the HostRoot completes, its subtreeFlags says whether anything anywhere below has a passive effect,
      and the commit phase can skip every subtree whose subtreeFlags lacks the bits it is looking for.
    code: |
      function bubbleProperties(completedWork: Fiber) {
        const didBailout =
          completedWork.alternate !== null &&
          completedWork.alternate.child === completedWork.child;

        let newChildLanes: Lanes = NoLanes;
        let subtreeFlags: Flags = NoFlags;

        if (!didBailout) {
          // Bubble up the earliest expiration time.
          if (enableProfilerTimer && (completedWork.mode & ProfileMode) !== NoMode) {
            // ... the same loop, also summing profiler durations
          } else {
            let child = completedWork.child;
            while (child !== null) {
              newChildLanes = mergeLanes(
                newChildLanes,
                mergeLanes(child.lanes, child.childLanes),
              );

              subtreeFlags |= child.subtreeFlags;
              subtreeFlags |= child.flags;

              // Update the return pointer so the tree is consistent. This is a code
              // smell because it assumes the commit phase is never concurrent with
              // the render phase. Will address during refactor to alternate model.
              child.return = completedWork;

              child = child.sibling;
            }
          }

          completedWork.subtreeFlags |= subtreeFlags;
        } else {
          // ... after a bailout, bubble only the Static flags
        }

        completedWork.childLanes = newChildLanes;

        return didBailout;
      }
    next: commitRoot(root, finishedWork, lanes, …)
  - id: step-6
    title: commitRoot books a task for later
    symbol: commitRoot
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberWorkLoop.js
    lines: 3790-3827
    body: >-
      Before touching the DOM, commitRoot checks the root's flags against PassiveMask. If there are passive
      effects, it schedules flushPassiveEffects as a NormalPriority Scheduler task. The DOM mutations and
      layout effects then run synchronously in this commit, and the browser gets a chance to paint before
      that task runs.
    code: |
      if (
        // If this subtree rendered with profiling this commit, we need to visit it to log it.
        (enableProfilerTimer &&
          enableComponentPerformanceTrack &&
          finishedWork.actualDuration !== 0) ||
        (finishedWork.subtreeFlags & passiveSubtreeMask) !== NoFlags ||
        (finishedWork.flags & passiveSubtreeMask) !== NoFlags
      ) {
        if (enableYieldingBeforePassive) {
          // We don't schedule a separate task for flushing passive effects.
          // Instead, we just rely on ensureRootIsScheduled below to schedule
          // a callback for us to flush the passive effects.
        } else {
          // So we can clear these now to allow a new callback to be scheduled.
          root.callbackNode = null;
          root.callbackPriority = NoLane;
          scheduleCallback(NormalSchedulerPriority, () => {
            if (enableProfilerTimer && enableComponentPerformanceTrack) {
              // Track the currently executing event if there is one so we can ignore this
              // event when logging events.
              trackSchedulerEvent();
            }
            if (pendingDelayedCommitReason === IMMEDIATE_COMMIT) {
              pendingDelayedCommitReason = DELAYED_PASSIVE_COMMIT;
            }
            flushPassiveEffects();
            // This render triggered passive effects: release the root cache pool
            // *after* passive effects fire to avoid freeing a cache pool that may
            // be referenced by a node in the tree (HostRoot, Cache boundary etc)
            return null;
          });
        }
      } else {
        // If we don't have passive effects, we're not going to need to perform more work
        // so we can clear the callback now.
        root.callbackNode = null;
        root.callbackPriority = NoLane;
      }
    next: mutation and layout phases (chapter 11) → flushSpawnedWork()
  - id: step-7
    title: A click would not wait
    symbol: flushSpawnedWork
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberWorkLoop.js
    lines: 4316-4333
    body: >-
      At the end of the commit, the lanes that were rendered decide. Our render was DefaultLane, so the
      effect keeps waiting for its Scheduler task. Had it been SyncLane — the setState in a click handler
      from chapter 07 — passive effects would be flushed right here, in the same task, so their result is
      immediately observable.
    code: |
      // If the passive effects are the result of a discrete render, flush them
      // synchronously at the end of the current task so that the result is
      // immediately observable. Otherwise, we assume that they are not
      // order-dependent and do not need to be observed by external systems, so we
      // can wait until after paint.
      // TODO: We can optimize this by not scheduling the callback earlier. Since we
      // currently schedule the callback in multiple places, will wait until those
      // are consolidated.
      if (
        includesSyncLane(pendingEffectsLanes) &&
        (disableLegacyMode || root.tag !== LegacyRoot)
      ) {
        flushPendingEffects();
      }

      // Always call this before exiting `completeRoot`, to ensure that any
      // additional work on this root is scheduled.
      ensureRootIsScheduled(root);
    next: "Scheduler task runs → flushPassiveEffects() → flushPassiveEffectsImpl()"
  - id: step-8
    title: All cleanups first, then all effects
    symbol: flushPassiveEffectsImpl
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberWorkLoop.js
    lines: 4728-4795
    body: >-
      The pending commit's root and lanes were saved in module variables; they are read and cleared. Then
      two full tree walks: every cleanup that must run (from deleted fibers, or effects whose deps changed),
      then every effect with HookHasEffect. So no effect ever runs while another component's stale cleanup
      is still pending.
    code: |
      function flushPassiveEffectsImpl() {
        // ... comment
        const transitions = pendingPassiveTransitions;
        pendingPassiveTransitions = null;

        const root = pendingEffectsRoot;
        const lanes = pendingEffectsLanes;
        pendingEffectsStatus = NO_PENDING_EFFECTS;
        pendingEffectsRoot = null as any; // Clear for GC purposes.
        pendingFinishedWork = null as any; // Clear for GC purposes.
        // ... comment
        pendingEffectsLanes = NoLanes;
        // ...
        if ((executionContext & (RenderContext | CommitContext)) !== NoContext) {
          throw new Error('Cannot flush passive effects while already rendering.');
        }
        // ... profiling and DEV bookkeeping
        const prevExecutionContext = executionContext;
        executionContext |= CommitContext;

        commitPassiveUnmountEffects(root.current);
        commitPassiveMountEffects(
          root,
          root.current,
          lanes,
          transitions,
          pendingEffectsRenderEndTime,
        );
    next: commitPassiveMountEffects → commitPassiveMountOnFiber(root, HostRoot fiber, …)
  - id: step-9
    title: Children first, then the fiber itself
    symbol: commitPassiveMountOnFiber
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberCommitWork.js
    lines: 3841-3915
    body: >-
      The walk is recursive and descends only into subtrees whose subtreeFlags include a passive bit.
      Children are handled before their parent, so a child's effects run before its parent's. For a
      function component with the Passive flag, the hook effects tagged HookPassive | HookHasEffect run.
    code: |
      function commitPassiveMountOnFiber(
        finishedRoot: FiberRoot,
        finishedWork: Fiber,
        committedLanes: Lanes,
        committedTransitions: Array<Transition> | null,
        endTime: number, // Profiling-only. The start time of the next Fiber or root completion.
      ): void {
        // ... profiler timers; restore View Transitions for new mounts
        const flags = finishedWork.flags;
        switch (finishedWork.tag) {
          case FunctionComponent:
          case ForwardRef:
          case SimpleMemoComponent: {
            // ... log the component's render time when profiling
            recursivelyTraversePassiveMountEffects(
              finishedRoot,
              finishedWork,
              committedLanes,
              committedTransitions,
              endTime,
            );
            if (flags & Passive) {
              commitHookPassiveMountEffects(
                finishedWork,
                HookPassive | HookHasEffect,
              );
            }
            break;
          }
    next: commitHookPassiveMountEffects → commitHookEffectListMount(HookPassive | HookHasEffect, App)
  - id: step-10
    title: create() runs; its return value is kept
    symbol: commitHookEffectListMount
    package: react-reconciler
    file: packages/react-reconciler/src/ReactFiberCommitEffects.js
    lines: 141-247
    body: >-
      The circular list from step 4 is walked once. Every effect whose tag has all the requested bits is
      created, and whatever it returns is stored in inst.destroy — the cleanup that
      commitHookEffectListUnmount calls before the effect runs again, or when the component unmounts. An
      error is caught and routed to the nearest error boundary.
    code: |
      export function commitHookEffectListMount(
        flags: HookFlags,
        finishedWork: Fiber,
      ) {
        try {
          const updateQueue: FunctionComponentUpdateQueue | null =
            finishedWork.updateQueue as any;
          const lastEffect = updateQueue !== null ? updateQueue.lastEffect : null;
          if (lastEffect !== null) {
            const firstEffect = lastEffect.next;
            let effect = firstEffect;
            do {
              if ((effect.tag & flags) === flags) {
                // ... scheduling profiler marks
                // Mount
                let destroy;
                if (__DEV__) {
                  // ... the same call through runWithFiberInDEV
                } else {
                  const create = effect.create;
                  const inst = effect.inst;
                  destroy = create();
                  inst.destroy = destroy;
                }
                // ... DEV: warn if create returned something other than a function
              }
              effect = effect.next;
            } while (effect !== firstEffect);
          }
        } catch (error) {
          captureCommitPhaseError(finishedWork, finishedWork.return, error);
        }
      }
    next: "document.title = 'Ready'"
