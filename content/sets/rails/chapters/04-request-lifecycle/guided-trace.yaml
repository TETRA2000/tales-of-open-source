format: GT
title: "From socket to controller: the path of one request"
level: practitioner
minutes: 12
pin: "c3466ea00d7121798e3aa3144ffdf7174b81d8cb"
example:
  request: GET /articles/42
  target: ArticlesController#show
steps:
  - id: step-1
    title: Puma hands Rails a Rack env
    symbol: config.ru
    package: railties
    file: railties/lib/rails/generators/rails/app/templates/config.ru.tt
    lines: 1-6
    body: >-
      The web server parses raw HTTP into a plain Ruby hash — the Rack env — and calls #call on
      whatever object config.ru runs. rails new writes config.ru from this template in railties,
      so in every Rails app that object is Rails.application.
    code: |
      # This file is used by Rack-based servers to start the application.

      require_relative "config/environment"

      run Rails.application
      Rails.application.load_server
    next: Rails.application.call(env)
  - id: step-2
    title: "The application object answers #call"
    symbol: Rails::Engine#call
    package: railties
    file: railties/lib/rails/engine.rb
    lines: 532-535
    body: >-
      Rails::Application inherits #call from Rails::Engine. It wraps the env in a request object,
      then passes it to app — not your app, but the middleware stack Rails built at boot.
    code: |
      def call(env)
        req = build_request env
        app.call req.env
      end
    next: app → the first middleware
  - id: step-3
    title: Through the middleware stack
    symbol: DefaultMiddlewareStack#build_stack
    package: railties
    file: railties/lib/rails/application/default_middleware_stack.rb
    lines: 14-110
    body: >-
      Each middleware is an object with #call that does a little work and calls the next one:
      host checks, static files, the executor, cookies, sessions, flash. The last link in the chain is the router.
    code: |
      def build_stack
        ActionDispatch::MiddlewareStack.new do |middleware|
          # ... host authorization, SSL, Rack::Sendfile, static files, Rack::Cache ...
          middleware.use ::ActionDispatch::Executor, app.executor

          middleware.use ::ActionDispatch::ServerTiming if config.server_timing
          middleware.use ::Rack::Runtime
          middleware.use ::Rack::MethodOverride unless config.api_only
          # ... request id, remote IP, logger, exception pages, reloader ...
          middleware.use ::ActionDispatch::Callbacks
          middleware.use ::ActionDispatch::Cookies unless config.api_only
          # ... session store, flash, content security policy ...
          middleware.use ::Rack::Head
          middleware.use ::Rack::ConditionalGet
          middleware.use ::Rack::ETag, "no-cache"
          # ... tempfile reaper, database selectors ...
        end
      end
    next: Rails.application.routes.call(env)
  - id: step-4
    title: The route set normalises the path
    symbol: RouteSet#call
    package: actionpack
    file: actionpack/lib/action_dispatch/routing/route_set.rb
    lines: 903-907
    body: >-
      routes.rb compiled into a RouteSet at boot. Its #call builds an ActionDispatch::Request,
      tidies the path, and hands the request to the Journey router — the engine that actually matches URLs.
    code: |
      def call(env)
        req = make_request(env)
        req.path_info = Journey::Router::Utils.normalize_path(req.path_info)
        @router.serve(req)
      end
    next: Journey::Router#serve(req)
  - id: step-5
    title: Journey finds the matching route
    symbol: Journey::Router#serve
    package: actionpack
    file: actionpack/lib/action_dispatch/journey/router.rb
    lines: 30-41
    body: >-
      recognize filters the compiled route table down to the routes that match this request and yields
      each one with its parameters: the route's defaults (controller "articles", action "show") merged with
      what the path captured (id "42"). serve stores them as path_parameters — this is where params[:id]
      is born — and calls the route's app. If that app answers X-Cascade: pass, the next matching route
      gets its turn; when none is left, the answer is a 404.
    code: |
      def serve(req)
        recognize(req) do |route, parameters|
          req.path_parameters = parameters
          req.route = route

          _, headers, _ = response = route.app.serve(req)

          return response unless headers[Constants::X_CASCADE] == "pass"
        end

        [404, { Constants::X_CASCADE => "pass" }, ["Not Found"]]
      end
    next: route.app.serve(req) → Dispatcher
  - id: step-6
    title: The dispatcher picks a controller
    symbol: RouteSet::Dispatcher#serve
    package: actionpack
    file: actionpack/lib/action_dispatch/routing/route_set.rb
    lines: 46-57
    body: >-
      The route's endpoint is a Dispatcher. It turns "articles" into ArticlesController, asks the
      controller class for a fresh response, and calls dispatch with the action name.
    code: |
      def serve(req)
        params     = req.path_parameters
        controller = controller req
        res        = controller.make_response! req
        dispatch(controller, params[:action], req, res)
      rescue ActionController::RoutingError
        # ...
      end
    next: ArticlesController.dispatch("show", req, res)
  - id: step-7
    title: Metal sets up request and response
    symbol: ActionController::Metal#dispatch
    package: actionpack
    file: actionpack/lib/action_controller/metal.rb
    lines: 249-255
    body: >-
      A new controller instance is created for every request. dispatch stores the request and response
      on it, runs process, commits the flash, and finally returns the Rack triple [status, headers, body].
    code: |
      def dispatch(name, request, response) # :nodoc:
        set_request!(request)
        set_response!(response)
        process(name)
        request.commit_flash
        to_a
      end
    next: AbstractController::Base#process("show")
  - id: step-8
    title: Callbacks, your action, the render
    symbol: AbstractController::Base#process
    package: actionpack
    file: actionpack/lib/abstract_controller/base.rb
    lines: 145-155
    body: >-
      process finds the method, then process_action runs your before_action callbacks around it.
      The action is called with send; if it did not render or redirect, ImplicitRender calls
      default_render — show.html.erb.
    code: |
      def process(action, ...)
        @_action_name = action.to_s

        unless action_name = _find_action_name(@_action_name)
          raise ActionNotFound.new("The action '#{action}' could not be found for #{self.class.name}", self, action)
        end

        @_response_body = nil

        process_action(action_name, ...)
      end
    next: ArticlesController#show → ActionView
